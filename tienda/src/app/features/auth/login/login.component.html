<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="intro">Accede con tu correo o número de teléfono</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="correo">Identificación</label>
      <span class="field-wrap">
        <i class="pi pi-envelope" aria-hidden="true"></i>
        <input id="correo" class="login-input" pInputText type="email" formControlName="correo" placeholder="correo@ejemplo.com" autocomplete="username" />
      </span>
      <small class="field-error" *ngIf="form.controls.correo.touched && form.controls.correo.invalid">Ingresa un correo válido.</small>
      <div class="password-heading"><label for="contrasena">Contraseña</label><a href="#">¿Olvidaste tu contraseña?</a></div>
      <span class="field-wrap password-field">
        <p-password inputId="contrasena" styleClass="password-control" inputStyleClass="login-input" formControlName="contrasena" placeholder="••••••••" [feedback]="false" [toggleMask]="true" autocomplete="current-password"></p-password>
      </span>
      <small class="field-error" *ngIf="form.controls.contrasena.touched && form.controls.contrasena.invalid">Ingresa tu contraseña.</small>
      <!-- <div class="remember"><p-checkbox inputId="recordarme" formControlName="recordarme" [binary]="true"></p-checkbox><label for="recordarme">Recordarme</label></div> -->
      <p class="login-success" *ngIf="success" role="status"><i class="pi pi-check-circle"></i>{{ success }}</p>
      <p class="login-error" *ngIf="error" role="alert"><i class="pi pi-exclamation-circle"></i>{{ error }}</p>
      <button pButton type="submit" label="Iniciar sesión" [loading]="loading" class="submit-button"></button>
    </form>
    <p class="create-account">¿No tienes una cuenta? <a routerLink="/registro">Crear cuenta</a></p>
  </section>
</main>
