<main class="verification-page">
  <section class="verification-card" aria-labelledby="verification-title">
    <span class="mail-icon"><i class="pi pi-envelope" aria-hidden="true"></i></span>
    <h1 id="verification-title">Verifica tu correo</h1>
    <p>Escribe el código de 6 dígitos que enviamos a tu correo. Caduca en 10 minutos.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="codigo">Código de verificación</label>
      <input
        id="codigo"
        type="text"
        formControlName="codigo"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="[0-9]{6}"
        placeholder="000000"
      />
      @if (form.controls.codigo.touched && form.controls.codigo.invalid) {
        <small>Ingresa exactamente 6 números.</small>
      }
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="loading()">
        @if (loading()) { <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> }
        Verificar y continuar
      </button>
    </form>

    <button class="resend" type="button" (click)="resend()" [disabled]="secondsUntilResend() > 0 || resending()">
      @if (secondsUntilResend() > 0) {
        Reenviar código en {{ secondsUntilResend() }} s
      } @else if (resending()) {
        Enviando…
      } @else {
        Reenviar código
      }
    </button>
    <a routerLink="/registro">Usar otro correo</a>
  </section>
</main>
