server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html nunca se cachea: apunta a los bundles con hash vigentes
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Bundles y assets con hash de Angular
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API hacia el backend, mismo origen (sin CORS).
    # Sin barra final en proxy_pass: preserva el path /api/v1/... completo.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rutas del Angular Router: sin esto una recarga profunda devuelve 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
